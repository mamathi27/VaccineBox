<!DOCTYPE html>
<html>

<head>
    <title>Add Temperature Reading</title>
</head>

<body>

<h2>Add Temperature Reading</h2>

<form method="POST">

    <label>Box ID</label><br>
    <input type="text" name="box_id" required><br><br>

    <label>Temperature (°C)</label><br>
    <input type="number" step="0.1" name="temperature" required><br><br>

    <label>Location</label><br>
    <input type="text" name="location" required><br><br>

    <button type="submit">Save Reading</button>

</form>

</body>
</html>
